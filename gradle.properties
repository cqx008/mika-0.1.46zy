org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Kotlin 后端在 2g 下会 OOM(IR lowering),CI 的 app(Android) 因此失败
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
# 可配置后端的基础 URL(账号/反馈/更新)。默认留空不配置;自建后端时注入:
# MIKA_BACKEND_BASE=https://your-backend.example.com
# 真机测试结束后不卸载 App:卸载会丢失无线调试配对(钥匙存在 App 里)和无障碍授权,每次都得重新配对
android.injected.androidTest.leaveApksInstalledAfterRun=true
